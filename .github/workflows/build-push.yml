name: Test, Build & Push Docker Image

on:
  push:
    branches:
      - main
      - "exp/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/seongwonm/sh-ard-asset-agent

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main이든 exp/**든, 방금 push된 그 브랜치의 manifest를 그 브랜치 자신의
      # 이미지로 갱신한다. 그래야 exp 브랜치에서 kubectl apply -f k8s/*.yaml을
      # 그대로 써도 그 브랜치의 최신 코드가 담긴 이미지가 돈다.
      - name: Update image SHA in k8s manifests
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" \
            k8s/pod.yaml k8s/robustness-job.yaml k8s/column-poc-job.yaml

          if git diff --quiet -- k8s/pod.yaml k8s/robustness-job.yaml k8s/column-poc-job.yaml; then
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/pod.yaml k8s/robustness-job.yaml k8s/column-poc-job.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
