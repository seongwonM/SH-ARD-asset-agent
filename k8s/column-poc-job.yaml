# /data/robustness_test 안의 CSV 전체를 배치로 해석하는 Job.
#
# CLI는 CSV 한 개씩만 처리하므로, 이 Job의 command에서 셸로 *.csv를 순회하며
# 하나씩 호출한다. 셸로 감싸는 이유는 CSV 하나가 실패해도 나머지를 계속 돌리기
# 위해서다(파이썬 배치 버전은 experiments/run_batch.py에 있다 - 로컬용).
#
# 데이터 넣기
#   ./k8s/scripts/upload-robustness-data.ps1      # data/robustness-test -> PVC
#
#   PVC는 클러스터 안에서만 마운트되므로 디버그 Pod를 경유해 넣는다. 이 스크립트는
#   /data/robustness_test를 **지우고 새로 넣는다** - 덧씌우기만 하면 예전 실험에서
#   올린 CSV가 남아 이 Job이 조용히 같이 돌린다.
#
# 코드 위치
#   기본은 이미지 안의 /app이다. src / prompts / skills가 deploy/Dockerfile로
#   COPY되어 있으므로 추가 준비 없이 바로 돈다.
#   USE_PVC_CODE=1로 두면 /data/column_semantic_poc의 코드를 대신 쓴다 - 폐쇄망에서
#   이미지 재빌드 없이 코드만 바꿔 돌려보는 경로다(./k8s/scripts/upload-column-poc.ps1).
#   기본값은 0이라 명시하지 않으면 항상 이미지 코드가 돈다. 급하게 실험할 때만
#   켜고, 확정되면 커밋해서 이미지로 돌려놓을 것.
#
#   어느 코드가 돌았는지는 로그 맨 앞 [SRC] 줄이 말해준다. 이미지 코드면 빌드된
#   커밋 SHA까지 찍힌다 - "고친 코드가 도는 게 맞나"는 그 줄로 확인한다.
#
# 실행:
#   kubectl delete job column-poc-batch --ignore-not-found   # Job spec은 불변이라
#   kubectl apply -f k8s/column-poc-job.yaml                 # 지우고 다시 만든다
#   kubectl logs -f job/column-poc-batch
#
#   지우지 않고 apply만 하면 "field is immutable"로 거부되거나, 이미 끝난 예전
#   Job이 그대로 남아 새 이미지가 도는 것처럼 착각하게 된다. 로그 첫 줄의
#   [SRC] ... (빌드: <SHA>)로 실제로 어느 코드가 돌았는지 확인할 것.
#
# 결과 내려받기 (완료 후):
#   ./k8s/scripts/download-column-poc-results.ps1 -LocalDir .\results
#
# 결과: 이 Job이 시작될 때 KST(UTC+9) 타임스탬프를 딱 한 번 찍어서
# /data/robustness_test_results/<실행타임스탬프>/ 폴더를 만들고, 그 아래는
#
#   <실행타임스탬프>/iter<회차>/<모델명>/<csv_stem>/
#
# 로 갈린다 - Job 실행 한 번 = 실험 하나. CSV마다 타임스탬프를 따로 찍지 않는다
# (그러면 같은 배치로 돌린 CSV들이 서로 다른 폴더로 흩어져서 어느 실행에 속하는지
# 헷갈린다).
#
# 반복(강건성): secret의 ITERATIONS만큼 (모델 x CSV) 한 바퀴를 통째로 반복한다.
# 없으면 1이다(셸 기본값).
# 같은 입력을 여러 번 돌려 답이 얼마나 흔들리는지 보려는 것이라 회차만 폴더로
# 갈리고 타임스탬프는 공유한다. 회차가 1이어도 iter1/이 생긴다 - 경로 모양이
# 반복 여부에 따라 달라지면 결과를 읽는 쪽이 두 가지를 알아야 한다.
#
# 모델: secret의 LLM_MODEL에 쉼표로 여러 개를 적으면(modelA,modelB) 모델마다 한
# 바퀴씩 돌고 폴더가 모델별로 갈린다 - 타임스탬프도 회차도 같으니 같은 실험의
# 같은 회차로 묶인다. 하나만 적으면 폴더도 하나다. 모델을 도는 것과 폴더 규칙은
# CLI가 하고, 이 셸은 회차와 CSV만 순회한다.
# 각 <csv_stem>/ 안에는 결과 파일 6개(result.semantic.columns.json /
# .rulebase.json / .plan.json / .table.json / .llm_calls.json / .lean.json)와 run.log가 같이
# 들어간다. 무엇이 어느 파일에 들어가는지는 src/column_semantics/pipeline/
# documents.py에 있다.
#
# 이전 결과가 있어도 매번 모든 CSV를 처음부터 다시 돈다 - "이미 결과 있으면
# 건너뛴다"는 재개(resume) 기능이 예전엔 있었지만, 파이프라인 로직 자체가
# 계속 바뀌는 지금은 예전 코드로 만든 결과를 "끝났음"으로 인정하는 게 오히려
# 문제였다(새 로직이 실제로 도는 걸 확인할 수가 없었음) - 의도적으로 뺐다.
# 특정 CSV가 실패해도(파싱/LLM 오류 등) 나머지는 계속 돌고, 실패 목록은
# 마지막에 로그로 남는다.
#
# run.log에 stdout/stderr 전체(각 skill/LLM 호출의 시작·완료·소요시간)가
# 성공/실패 관계없이 항상 남는다 - 성공해도 지우지 않는다. 로그 맨 아래에는
# 성공·실패 모두 columns/table 두 문서를 붙인다(해석 결과 자체). rulebase와
# llm_calls는 크기 때문에 붙이지 않는다 - 파일로 내려받아 볼 것. Job의
# kubectl logs가 ttlSecondsAfterFinished 이후 사라져도 PVC의 이 파일로 무엇을
# 했는지·왜 실패했는지 다시 확인할 수 있다.
#
# CLI는 CSV 하나를 처리하는 도중에도 단계가 끝날 때마다 결과 파일 6개를
# 그대로 덮어쓴다 - 중간에 죽어도 그때까지 계산된 내용은 파일에 남아 있다.
# 완주 여부는 파일명이 아니라 각 파일의 meta.status로 판별한다(in_progress면
# 그 CSV는 중간에 죽은 것이다). meta.started_at/finished_at(모두 KST)과
# plan 문서의 execution(각 skill/probe 구간의 시작·종료 타임스탬프, 역시 KST),
# llm_calls 문서의 호출별 타임스탬프로 여러 번 실행한 기록을 시간순으로
# 비교할 수 있다.
#
# CSV가 여러 개일 때는 이미 끝난 CSV의 폴더는 Job이 다음 CSV를 처리하는 동안에도
# 바로 내려받을 수 있다 - 전체 Job이 끝나길 기다릴 필요 없다.
#
# 이미지 태그는 .github/workflows/build-push.yml이 커밋 SHA로 자동 갱신한다
# (main뿐 아니라 exp/**도 - 방금 push된 그 브랜치 자신의 이미지로 갱신됨).
# 수동으로 건드리지 말 것(pod.yaml/robustness-job.yaml과 동일).
#
# LLM_API_ENDPOINT/LLM_API_KEY/LLM_MODEL은 .env.example에 정의된 대로
# sh-ard-asset-agent-secret(robustness-job.yaml/pod.yaml과 같은 secret)에서
# envFrom으로 그대로 들어온다.
#
# 반복 횟수(ITERATIONS), 처리량(LLM_REQUESTS_PER_MINUTE / LLM_MAX_CONCURRENCY),
# 호출 하나가 얼마나 버티는지(LLM_TIMEOUT_SECONDS / LLM_MAX_RETRIES /
# LLM_RETRY_BACKOFF_SECONDS / LLM_HTTP_RETRIES)도 전부 같은 secret에서 온다.
# 환경(개발/폐쇄망)마다 다른 값을 쓰는데 yaml에 박으면 환경을 옮길 때마다 커밋이
# 생기기 때문이다. 값을 바꾸려면 .env를 고치고
# ./k8s/scripts/create-secret-from-env.ps1을 다시 돌린다(그 스크립트의 화이트리스트에
# 키가 있어야 올라간다). **이 값들을 아래 env에 적지 말 것** - env가 envFrom을
# 이겨서, 한 줄 넣는 순간 그 키는 secret을 고쳐도 안 먹는다.
# 값이 레포에 없어도 실행 기록에서 되짚을 수 있다: run.log 맨 앞 [CONFIG] 줄과
# 각 결과 문서의 meta(llm_call, env 스냅샷)에 그 실행이 실제로 쓴 값이 남는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: column-poc-batch
spec:
  # 0: CSV 하나가 실패해서 셸이 exit 1을 내도 **전체를 다시 돌리지 않는다.**
  # 이 Job은 (회차 x 모델 x CSV) 전부를 한 컨테이너 안에서 순회하므로, 재시도는
  # "실패한 것만 다시"가 아니라 처음부터 전부 다시다 - 새 타임스탬프 폴더에
  # 중복 결과가 쌓이고, 오래 도는 실험일수록 손해가 크다. 실패한 CSV는 각
  # 폴더의 run.log와 [FAILED LIST]로 확인해서 그것만 다시 돌리는 게 맞다.
  # (재시도가 필요한 종류의 실패 - 엔드포인트가 잠깐 흔들리는 것 - 는 LLM
  #  어댑터의 LLM_MAX_RETRIES/LLM_RETRY_BACKOFF_SECONDS가 이미 잡는다.)
  backoffLimit: 0
  # 끝난 Job 오브젝트가 남는 시간(3일). 금요일에 돌린 것을 월요일에 `kubectl logs`
  # 로 볼 수 있어야 한다. 결과와 run.log는 PVC에 있으니 이 값과 무관하게 남는다.
  ttlSecondsAfterFinished: 259200
  # 상한을 두지 않는다 - 회차를 늘리면 며칠이 걸릴 수 있고, 시간으로 끊으면
  # 마지막 회차만 반쯤 남아 비교가 안 되는 결과가 된다. 대신 다 돌기 전에
  # 멈추고 싶으면 `kubectl delete job column-poc-batch`로 끊는다(그때까지의
  # 결과는 PVC에 그대로 있다).
  # activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: sh-ard-asset-agent
        role: column-poc-batch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: column-poc-batch
          image: ghcr.io/seongwonm/sh-ard-asset-agent:b5df9a92696ac9d0852b38a464079366a1e24b51
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail
              DATA_DIR=/data/robustness_test
              OUT_DIR=/data/robustness_test_results
              mkdir -p "$OUT_DIR"

              # 코드는 기본적으로 이미지 안의 /app을 쓴다. PVC에 올려둔 코드를 쓰려면
              # USE_PVC_CODE=1을 명시해야 한다 - 예전에는 PVC에 코드가 있기만 하면
              # 조용히 그쪽이 이겼는데, 그러면 몇 달 전 업로드가 남아 있는 줄 모르고
              # "새로 고친 코드가 왜 안 도나"를 이미지에서 찾게 된다.
              SRC_DIR=/app
              PVC_SRC=/data/column_semantic_poc
              if [ "${USE_PVC_CODE:-0}" = "1" ]; then
                if [ ! -d "$PVC_SRC/src" ]; then
                  echo "[ERROR] USE_PVC_CODE=1인데 $PVC_SRC/src가 없습니다. upload-column-poc.ps1로 올리세요." >&2
                  exit 1
                fi
                SRC_DIR="$PVC_SRC"
                echo "[SRC] PVC 코드 사용: $SRC_DIR (이미지 코드가 아님 - 실험이 끝나면 지울 것)"
              else
                echo "[SRC] 이미지 코드 사용: $SRC_DIR (빌드: $(cat /app/BUILD_SHA 2>/dev/null || echo unknown))"
                if [ -d "$PVC_SRC/src" ]; then
                  echo "[SRC] 참고: $PVC_SRC 에 예전에 올린 코드가 남아 있습니다. 지금은 쓰지 않습니다."
                  echo "[SRC]       지우려면: kubectl exec sh-ard-asset-agent -- rm -rf $PVC_SRC"
                fi
              fi

              if [ ! -d "$SRC_DIR/src" ] || [ ! -d "$SRC_DIR/prompts" ] || [ ! -d "$SRC_DIR/skills" ]; then
                echo "[ERROR] $SRC_DIR에 src/ / prompts/ / skills/ 중 없는 것이 있습니다." >&2
                exit 1
              fi
              export PYTHONPATH="$SRC_DIR/src"

              csv_count=$(ls -1 "$DATA_DIR"/*.csv 2>/dev/null | wc -l | tr -d ' ')
              echo "[BATCH] 데이터: $DATA_DIR (CSV ${csv_count}개)"
              echo "[BATCH] 모델: ${LLM_MODEL:-<미설정>}"
              echo "[BATCH] 엔드포인트: ${LLM_API_ENDPOINT:-<미설정>} rpm=${LLM_REQUESTS_PER_MINUTE:-360} concurrency=${LLM_MAX_CONCURRENCY:-12}"
              echo "[BATCH] 출력: $OUT_DIR"

              # 모델 목록과 결과 폴더 규칙, CSV별 run.log는 전부 CLI가 처리한다.
              # 여기 셸이 하는 일은 "CSV를 순회하며 하나씩 부르고, 하나가 실패해도
              # 나머지를 계속 돌린다" 뿐이다 - 셸에 로직이 쌓이면 테스트할 수가 없다.
              run_ts=$(date -u -d '+9 hours' +%Y%m%d_%H%M%S)
              if [ -z "$run_ts" ]; then
                # date가 이 옵션을 모르면(베이스 이미지가 바뀐 경우) 결과가 실행
                # 폴더 없이 루트에 쏟아진다 - 어느 실행 것인지 영영 못 가린다.
                echo "[ERROR] 실행 타임스탬프를 만들지 못했습니다(date -u -d 미지원)." >&2
                exit 1
              fi

              # 강건성 테스트: 같은 (모델 x CSV) 조합을 ITERATIONS번 반복한다.
              # 회차는 폴더 한 겹으로만 갈리고 타임스탬프는 공유한다 - 그래야
              # "같은 입력을 여러 번 돌린 결과"가 한 실험으로 묶인다.
              iterations="${ITERATIONS:-1}"
              case "$iterations" in
                ''|*[!0-9]*)
                  echo "[ERROR] ITERATIONS는 양의 정수여야 합니다(받은 값: '$iterations')." >&2
                  exit 1
                  ;;
              esac
              if [ "$iterations" -lt 1 ]; then
                echo "[ERROR] ITERATIONS는 1 이상이어야 합니다(받은 값: '$iterations')." >&2
                exit 1
              fi
              echo "[BATCH] 반복: ${iterations}회"
              echo "[RUN-ID] $run_ts -> $OUT_DIR/$run_ts/iter<N>/<모델명>/<csv이름>/"

              total=0
              ok=0
              failed=""
              iter=1
              while [ "$iter" -le "$iterations" ]; do
                echo ""
                echo "==== [ITER] ${iter}/${iterations} ===="
                for csv in "$DATA_DIR"/*.csv; do
                  total=$((total + 1))
                  name=$(basename "${csv%.csv}")
                  echo ""
                  echo "[RUN] iter${iter} / $name"
                  # 이전 결과가 있든 없든 항상 다시 돈다 - 파이프라인 로직 자체가
                  # 계속 바뀌는 중이라 예전 결과(다른 코드로 만들어진)를 "이미
                  # 끝났음"으로 인정하면 새 로직이 실제로 뭘 하는지 확인할 수가
                  # 없다. 안전한 재개(resume)가 다시 필요해지면 여기에
                  # skip-if-exists 체크를 되살릴 것 - 지금은 의도적으로 뺐다.
                  if python -m column_semantics "$csv" \
                      --prompts "$SRC_DIR/prompts" \
                      --skills "$SRC_DIR/skills" \
                      --output-root "$OUT_DIR/$run_ts/iter$iter"; then
                    ok=$((ok + 1))
                  else
                    echo "[FAIL] iter${iter}/$name - 자세한 내용은 각 모델 폴더의 run.log"
                    failed="$failed iter${iter}/$name"
                  fi
                done
                iter=$((iter + 1))
              done

              echo ""
              echo "==== 완료: ${total}회 실행 중 ${ok}회 성공 (CSV x ${iterations}회) ===="
              if [ -n "$failed" ]; then
                echo "[FAILED LIST]$failed"
                echo "[FAILED LOGS] $OUT_DIR/$run_ts/iter<N>/<모델명>/<name>/run.log 에 그 실행의 전체 로그가 있다."
                exit 1
              fi

          # 여기 env에는 **코드 위치처럼 이미지에 매인 것만** 둔다.
          # 실험 설정(ITERATIONS, 처리량, 재시도)은 전부 secret에서 온다 - 환경마다
          # 다른 값을 쓰는데 yaml에 박으면 환경을 옮길 때마다 커밋이 생긴다.
          # env에 적으면 envFrom(secret)을 **이기기 때문에**, 여기 한 줄 넣는 순간
          # 그 키는 secret을 고쳐도 영영 안 먹는다. 값을 바꾸려면 .env를 고치고
          # ./k8s/scripts/create-secret-from-env.ps1을 다시 돌릴 것.
          env:
            # PVC에 올린 코드로 돌리려면 "1". 기본은 이미지 코드다.
            - name: USE_PVC_CODE
              value: "0"
            # 단계마다 최소 출력을 한 번 더 받아 <base>.lean.json에 남길지.
            # 기본이 켜짐이라 이 줄이 없어도 돈다 - "0"으로 두면 끄고, LLM 호출이
            # 절반으로 준다. **여기 적어야 한다**: secret은 LLM_* 화이트리스트만
            # 담아서(create-secret-from-env.ps1) .env에 적은 값은 클러스터로
            # 넘어오지 않는다. 실험 설정이라 결과와 같은 커밋에 남는 편이 맞다.
            - name: LEAN_TRACK
              value: "1"
          envFrom:
            - secretRef:
                name: sh-ard-asset-agent-secret
          volumeMounts:
            - name: data
              mountPath: /data
