# /data/robustness_test 안의 CSV 전체를 배치로 해석하는 Job.
#
# run.py는 CSV 한 개씩만 처리하므로, 이 Job의 command에서 셸로 *.csv를 순회하며
# 하나씩 호출한다. 셸로 감싸는 이유는 CSV 하나가 실패해도 나머지를 계속 돌리기
# 위해서다(파이썬 배치 버전은 experiments/run_batch.py에 있다 - 로컬용).
#
# 코드 위치
#   기본은 이미지 안의 /app이다. run.py / src / skills가 deploy/Dockerfile로
#   COPY되어 있으므로 추가 준비 없이 바로 돈다.
#   /data/column_semantic_poc/run.py가 있으면 그쪽을 대신 쓴다 - 폐쇄망에서
#   이미지 재빌드 없이 코드만 바꿔 돌려보는 경로다(./k8s/scripts/upload-column-poc.ps1).
#   급하게 실험할 때만 쓰고, 확정되면 커밋해서 이미지로 돌려놓을 것 - PVC에 남은
#   낡은 코드가 조용히 계속 쓰이는 게 이 경로의 유일한 위험이다.
#
# 실행:
#   kubectl apply -f k8s/column-poc-job.yaml
#   kubectl logs -f job/column-poc-batch
#
# 결과 내려받기 (완료 후):
#   ./k8s/scripts/download-column-poc-results.ps1 -LocalDir .\results
#
# 결과: 이 Job이 시작될 때 KST(UTC+9) 타임스탬프를 딱 한 번 찍어서
# /data/robustness_test_results/<실행타임스탬프>/ 폴더 하나를 만들고, 그 배치가
# 처리하는 CSV들이 전부 그 아래 <csv_stem>/ 하위폴더로 들어간다 - Job 실행 한 번
# = 실험 하나 = 폴더 하나. CSV마다 타임스탬프를 따로 찍지 않는다(그러면 같은
# 배치로 돌린 CSV들이 서로 다른 폴더로 흩어져서 어느 실행에 속하는지 헷갈린다).
# 각 <csv_stem>/ 안에는 result.semantic.json + run.log(+ 실패 시 .partial.json)가
# 같이 들어간다.
#
# 이전 결과가 있어도 매번 모든 CSV를 처음부터 다시 돈다 - "이미 결과 있으면
# 건너뛴다"는 재개(resume) 기능이 예전엔 있었지만, 파이프라인 로직 자체가
# 계속 바뀌는 지금은 예전 코드로 만든 결과를 "끝났음"으로 인정하는 게 오히려
# 문제였다(새 로직이 실제로 도는 걸 확인할 수가 없었음) - 의도적으로 뺐다.
# 특정 CSV가 실패해도(파싱/LLM 오류 등) 나머지는 계속 돌고, 실패 목록은
# 마지막에 로그로 남는다.
#
# run.log에 stdout/stderr 전체(각 skill/LLM 호출의 시작·완료·소요시간)가
# 성공/실패 관계없이 항상 남는다 - 성공해도 지우지 않는다. 성공하면 로그 맨
# 아래에 "==== RESULT ====" 구분선과 함께 최종 결과 JSON을 그대로 붙이고,
# 실패하면 그때까지 쌓인 partial 결과가 있으면 "==== PARTIAL RESULT ===="로
# 붙인다. Job의 kubectl logs가 ttlSecondsAfterFinished 이후 사라져도 PVC의 이
# 파일로 무엇을 했는지·왜 실패했는지 다시 확인할 수 있다.
#
# run.py는 CSV 하나를 처리하는 도중에도 skill이 끝날 때마다 같은 폴더 안
# result.semantic.json.partial.json에 그때까지 결과를 체크포인트로 남긴다(성공하면
# 최종 파일로 대체되고 지워짐) - 중간에 죽어도 그때까지 계산된 skill 출력은
# partial 파일에 남는다. 최종 결과 JSON에는 meta.started_at/finished_at(모두 KST)과
# timeline(각 skill/LLM 호출/probe의 시작·종료 타임스탬프, 역시 KST)이 들어있어
# 여러 번 실행한 기록을 시간순으로 비교할 수 있다.
#
# CSV가 여러 개일 때는 이미 끝난 CSV의 폴더는 Job이 다음 CSV를 처리하는 동안에도
# 바로 내려받을 수 있다 - 전체 Job이 끝나길 기다릴 필요 없다.
#
# 이미지 태그는 .github/workflows/build-push.yml이 커밋 SHA로 자동 갱신한다
# (main뿐 아니라 exp/**도 - 방금 push된 그 브랜치 자신의 이미지로 갱신됨).
# 수동으로 건드리지 말 것(pod.yaml/robustness-job.yaml과 동일).
#
# LLM_API_ENDPOINT/LLM_API_KEY/LLM_MODEL은 .env.example에 정의된 대로
# sh-ard-asset-agent-secret(robustness-job.yaml/pod.yaml과 같은 secret)에서
# envFrom으로 그대로 들어온다.
apiVersion: batch/v1
kind: Job
metadata:
  name: column-poc-batch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: sh-ard-asset-agent
        role: column-poc-batch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: column-poc-batch
          image: ghcr.io/seongwonm/sh-ard-asset-agent:b7dff2b389d85449c5edaf6a1abb526b32b90413
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail
              DATA_DIR=/data/robustness_test
              OUT_DIR=/data/robustness_test_results
              mkdir -p "$OUT_DIR"

              # 기본은 이미지 안의 코드. PVC에 올려둔 코드가 있으면 그게 이긴다.
              SRC_DIR=/app
              if [ -f /data/column_semantic_poc/run.py ]; then
                SRC_DIR=/data/column_semantic_poc
                echo "[SRC] PVC 코드 사용: $SRC_DIR (이미지 코드가 아님 - 의도한 것인지 확인할 것)"
              else
                echo "[SRC] 이미지 코드 사용: $SRC_DIR"
              fi

              if [ ! -f "$SRC_DIR/run.py" ] || [ ! -d "$SRC_DIR/skills" ]; then
                echo "[ERROR] $SRC_DIR에 run.py 또는 skills/가 없습니다." >&2
                exit 1
              fi

              # KST(UTC+9) 타임스탬프를 Job 실행당 딱 한 번만 찍는다(CSV마다 새로 찍지
              # 않음) - 이 배치 실행 전체가 "실험 하나"라서, 그 안의 CSV들이 각자 다른
              # 타임스탬프로 흩어지면 안 되고 같은 폴더 아래 모여야 한다. 컨테이너에
              # 시간대 DB가 없을 수 있어 "Asia/Seoul" 이름 대신 UTC + 9시간 고정
              # 오프셋을 계산한다.
              run_ts=$(date -u -d '+9 hours' +%Y%m%d_%H%M%S)
              run_dir="$OUT_DIR/$run_ts"
              echo "[RUN-ID] $run_ts -> $run_dir (돌릴 CSV가 있을 때만 생성됨)"

              total=0
              ok=0
              failed=""
              for csv in "$DATA_DIR"/*.csv; do
                total=$((total + 1))
                name=$(basename "${csv%.csv}")

                # 이전 결과가 있든 없든 항상 다시 돈다 - 파이프라인 로직 자체가
                # 계속 바뀌는 중이라 예전 결과(다른 코드로 만들어진)를 "이미
                # 끝났음"으로 인정하면 새 로직이 실제로 뭘 하는지 확인할 수가
                # 없다. 안전한 재개(resume)가 다시 필요해지면 여기에
                # skip-if-exists 체크를 되살릴 것 - 지금은 의도적으로 뺐다.
                exp_dir="$run_dir/$name"
                mkdir -p "$exp_dir"
                out="$exp_dir/result.semantic.json"
                log_file="$exp_dir/run.log"
                partial="${out}.partial.json"

                echo "[RUN] $name -> $exp_dir"
                rm -f "$log_file"
                if python "$SRC_DIR/run.py" "$csv" \
                    --skills "$SRC_DIR/skills" \
                    --output "$out" 2>&1 | tee "$log_file"; then
                  ok=$((ok + 1))
                  {
                    echo ""
                    echo "==== RESULT ($name) ===="
                    cat "$out"
                  } >> "$log_file"
                else
                  echo "[FAIL] $name - 원인: $log_file 마지막 20줄 ↓"
                  tail -n 20 "$log_file"
                  if [ -f "$partial" ]; then
                    {
                      echo ""
                      echo "==== PARTIAL RESULT ($name, 실패 직전까지) ===="
                      cat "$partial"
                    } >> "$log_file"
                  fi
                  failed="$failed $name"
                fi
              done

              echo "==== 완료: ${total}개 중 ${ok}개 성공 ===="
              if [ -n "$failed" ]; then
                echo "[FAILED LIST]$failed"
                echo "[FAILED LOGS] 이번 실행 폴더는 $run_dir 이고, 그 안의 <name>/run.log에 전체 로그(실패면 마지막에 partial 결과 포함)가 남아있다."
                exit 1
              fi
          envFrom:
            - secretRef:
                name: sh-ard-asset-agent-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sh-ard-asset-agent-data
