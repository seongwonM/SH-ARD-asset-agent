# column_semantic_poc를 /data/robustness_test 안의 CSV 전체에 대해 배치로 돌리는 Job.
#
# run.py는 CSV 한 개씩만 처리하는 구조라(examples/run_robustness_test.py와 달리
# 자체 배치 루프가 없다), 이 Job의 command에서 셸로 *.csv를 순회하며 하나씩 호출한다.
#
# column_semantic_poc는 deploy/Dockerfile에 COPY되어 있지 않아 GHCR 이미지 안에
# 없다. 최초 1회(그리고 로컬에서 run.py/skills를 고칠 때마다), PVC에 코드를
# 올려둬야 한다 - 이 kubectl cp가 빠지면 아래 Job은 "run.py가 없다"로 바로 실패한다:
#
#   ./k8s/scripts/upload-column-poc.ps1
#
# 실행:
#   kubectl apply -f k8s/column-poc-job.yaml
#   kubectl logs -f job/column-poc-batch
#
# 결과 내려받기 (완료 후):
#   ./k8s/scripts/download-column-poc-results.ps1 -LocalDir .\results
#
# 결과: /data/robustness_test_results/<csv_stem>_<KST타임스탬프>/ 폴더가 실험마다
# 하나씩 생기고, 그 안에 result.semantic.json + run.log(+ 실패 시 .partial.json)가
# 같이 들어간다. 예전엔 이 세 가지가 OUT_DIR에 파일명만 다르게 평평하게 쌓여서
# CSV가 늘어날수록 찾기 어려웠다 - 폴더로 묶어서 실험 하나 = 폴더 하나가 되게
# 정리했다(이 정리 이전에 쌓인 평평한 파일들은 그대로 둔다, 마이그레이션 안 함).
# 타임스탬프(YYYYMMDD_HHMMSS, 한국 시간 UTC+9)를 폴더명에 넣는 이유는 같은 CSV를
# 다시 돌렸을 때 이전 실행 기록이 덮어써지지 않게 하기 위함이다 - 여러 번 돌린
# 실험을 전부 남겨서 비교할 수 있다.
#
# 이미 결과 폴더가 있는 CSV(새 폴더 구조든 예전 평평한 파일이든 이름 접두사로
# glob 매칭)는 건너뛴다 — Job이 재시작(backoffLimit)되거나 다시 apply해도 처음부터
# 다시 돌지 않는다. 특정 CSV가 실패해도(파싱/LLM 오류 등) 나머지는 계속 돌고,
# 실패 목록은 마지막에 로그로 남는다.
#
# run.log에 run.py의 stdout/stderr 전체(각 skill/LLM 호출의 시작·완료·소요시간)가
# 성공/실패 관계없이 항상 남는다 - 성공해도 지우지 않는다. 성공하면 로그 맨
# 아래에 "==== RESULT ====" 구분선과 함께 최종 결과 JSON을 그대로 붙이고,
# 실패하면 그때까지 쌓인 partial 결과가 있으면 "==== PARTIAL RESULT ===="로
# 붙인다. Job의 kubectl logs가 ttlSecondsAfterFinished 이후 사라져도 PVC의 이
# 파일로 무엇을 했는지·왜 실패했는지 다시 확인할 수 있다.
#
# run.py는 CSV 하나를 처리하는 도중에도 skill이 끝날 때마다 같은 폴더 안
# result.semantic.json.partial.json에 그때까지 결과를 체크포인트로 남긴다(성공하면
# 최종 파일로 대체되고 지워짐) - 중간에 죽어도 그때까지 계산된 skill 출력은
# partial 파일에 남는다. 최종 결과 JSON에는 meta.started_at/finished_at(모두 KST)과
# timeline(각 skill/LLM 호출/probe의 시작·종료 타임스탬프, 역시 KST)이 들어있어
# 여러 번 실행한 기록을 시간순으로 비교할 수 있다.
#
# CSV가 여러 개일 때는 이미 끝난 CSV의 폴더는 Job이 다음 CSV를 처리하는 동안에도
# 바로 내려받을 수 있다 - 전체 Job이 끝나길 기다릴 필요 없다.
#
# 이미지 태그는 .github/workflows/build-push.yml이 커밋 SHA로 자동 갱신한다
# (main뿐 아니라 exp/**도 - 방금 push된 그 브랜치 자신의 이미지로 갱신됨).
# 수동으로 건드리지 말 것(pod.yaml/robustness-job.yaml과 동일).
#
# LLM_API_ENDPOINT/LLM_API_KEY/LLM_MODEL은 .env.example에 정의된 대로
# sh-ard-asset-agent-secret(robustness-job.yaml/pod.yaml과 같은 secret)에서
# envFrom으로 그대로 들어온다 - 이 브랜치는 LLM_MODEL1/2/3 같은 멀티모델 인덱싱을
# 쓰지 않으므로 별도 매핑이 필요 없다.
#
# 예전엔 여기서 pip install python-dotenv를 실행했다 - GHCR 이미지의
# requirements.txt에는 dotenv가 없어서였다(column_semantic_poc/requirements.txt에만
# 있고, 그건 Dockerfile이 쓰지 않는다). 하지만 폐쇄망 클러스터에선 PyPI 접근이
# 안 되니 매 Job 실행마다 pip install이 그 자체로 실패 지점이었다. run.py의 dotenv
# 사용을 examples/run_local.py와 같은 자체 .env 파서로 바꿔서(외부 패키지 없이
# 직접 파싱 - k8s는 어차피 secret이 환경변수를 주입하니 .env 파일 자체가 없다)
# 이 설치 자체를 없앴다.
apiVersion: batch/v1
kind: Job
metadata:
  name: column-poc-batch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: sh-ard-asset-agent
        role: column-poc-batch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: column-poc-batch
          image: ghcr.io/seongwonm/sh-ard-asset-agent:edb192e4b7cdd6928786a2440f3edf09dc9e568a
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail
              SRC_DIR=/data/column_semantic_poc
              DATA_DIR=/data/robustness_test
              OUT_DIR=/data/robustness_test_results
              mkdir -p "$OUT_DIR"

              if [ ! -f "$SRC_DIR/run.py" ] || [ ! -f "$SRC_DIR/csv_repair.py" ]; then
                echo "[ERROR] $SRC_DIR/run.py 또는 csv_repair.py가 없습니다. 먼저 PVC에 column_semantic_poc를 kubectl cp 하세요." >&2
                exit 1
              fi

              total=0
              ok=0
              skipped=0
              failed=""
              for csv in "$DATA_DIR"/*.csv; do
                total=$((total + 1))
                name=$(basename "${csv%.csv}")

                # 새 구조(폴더)와 예전 구조(평평한 파일, 이 필드 정리 이전에 쌓인 것) 둘 다
                # "이미 끝났음"으로 인정한다 - 예전 실행 기록을 다시 도는 낭비를 막는다.
                if compgen -G "$OUT_DIR/${name}_*/result.semantic.json" > /dev/null \
                    || compgen -G "$OUT_DIR/${name}_*.semantic.json" > /dev/null; then
                  echo "[SKIP] $name (이미 결과 있음)"
                  skipped=$((skipped + 1))
                  ok=$((ok + 1))
                  continue
                fi

                # KST(UTC+9) 타임스탬프. 컨테이너에 시간대 DB가 없을 수 있어
                # "Asia/Seoul" 이름 대신 UTC + 9시간 고정 오프셋을 계산한다.
                ts=$(date -u -d '+9 hours' +%Y%m%d_%H%M%S)
                exp_dir="$OUT_DIR/${name}_${ts}"
                mkdir -p "$exp_dir"
                out="$exp_dir/result.semantic.json"
                log_file="$exp_dir/run.log"
                partial="${out}.partial.json"

                echo "[RUN] $name (KST $ts) -> $exp_dir"
                rm -f "$log_file"
                if python "$SRC_DIR/run.py" "$csv" \
                    --skills "$SRC_DIR/skills" \
                    --output "$out" 2>&1 | tee "$log_file"; then
                  ok=$((ok + 1))
                  {
                    echo ""
                    echo "==== RESULT ($name) ===="
                    cat "$out"
                  } >> "$log_file"
                else
                  echo "[FAIL] $name - 원인: $log_file 마지막 20줄 ↓"
                  tail -n 20 "$log_file"
                  if [ -f "$partial" ]; then
                    {
                      echo ""
                      echo "==== PARTIAL RESULT ($name, 실패 직전까지) ===="
                      cat "$partial"
                    } >> "$log_file"
                  fi
                  failed="$failed $name"
                fi
              done

              echo "==== 완료: ${total}개 중 ${ok}개 성공 (스킵 ${skipped}개 포함) ===="
              if [ -n "$failed" ]; then
                echo "[FAILED LIST]$failed"
                echo "[FAILED LOGS] 각 실험 폴더는 /data/robustness_test_results/<name>_<KST타임스탬프>/ 이고, 그 안의 run.log에 전체 로그(실패면 마지막에 partial 결과 포함)가 남아있다."
                exit 1
              fi
          envFrom:
            - secretRef:
                name: sh-ard-asset-agent-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sh-ard-asset-agent-data
