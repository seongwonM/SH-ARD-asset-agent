# column_semantic_poc를 /data/robustness_test 안의 CSV 전체에 대해 배치로 돌리는 Job.
#
# run.py는 CSV 한 개씩만 처리하는 구조라(examples/run_robustness_test.py와 달리
# 자체 배치 루프가 없다), 이 Job의 command에서 셸로 *.csv를 순회하며 하나씩 호출한다.
#
# column_semantic_poc는 deploy/Dockerfile에 COPY되어 있지 않아 GHCR 이미지 안에
# 없다. 최초 1회(그리고 로컬에서 run.py/skills를 고칠 때마다), PVC에 코드를
# 올려둬야 한다 - 이 kubectl cp가 빠지면 아래 Job은 "run.py가 없다"로 바로 실패한다:
#
#   ./k8s/scripts/upload-column-poc.ps1
#
# 실행:
#   kubectl apply -f k8s/column-poc-job.yaml
#   kubectl logs -f job/column-poc-batch
#
# 결과: /data/robustness_test_results/<csv_stem>.semantic.json 로 CSV마다 하나씩 쌓인다.
# 이미 결과 파일이 있는 CSV는 건너뛴다 — Job이 재시작(backoffLimit)되거나 다시
# apply해도 처음부터 다시 돌지 않는다. 특정 CSV가 실패해도(파싱/LLM 오류 등)
# 나머지는 계속 돌고, 실패 목록은 마지막에 로그로 남는다. 각 실패의 stdout/stderr
# 전체는 /data/robustness_test_results/<csv_stem>.error.log로도 남는다(성공하면
# 지워짐) - Job의 kubectl logs가 ttlSecondsAfterFinished 이후 사라져도 PVC에서
# 원인을 다시 확인할 수 있다.
#
# 이미지 태그는 .github/workflows/build-push.yml이 커밋 SHA로 자동 갱신한다
# (main뿐 아니라 exp/**도 - 방금 push된 그 브랜치 자신의 이미지로 갱신됨).
# 수동으로 건드리지 말 것(pod.yaml/robustness-job.yaml과 동일).
#
# LLM_API_ENDPOINT/LLM_API_KEY/LLM_MODEL은 .env.example에 정의된 대로
# sh-ard-asset-agent-secret(robustness-job.yaml/pod.yaml과 같은 secret)에서
# envFrom으로 그대로 들어온다 - 이 브랜치는 LLM_MODEL1/2/3 같은 멀티모델 인덱싱을
# 쓰지 않으므로 별도 매핑이 필요 없다.
#
# 예전엔 여기서 pip install python-dotenv를 실행했다 - GHCR 이미지의
# requirements.txt에는 dotenv가 없어서였다(column_semantic_poc/requirements.txt에만
# 있고, 그건 Dockerfile이 쓰지 않는다). 하지만 폐쇄망 클러스터에선 PyPI 접근이
# 안 되니 매 Job 실행마다 pip install이 그 자체로 실패 지점이었다. run.py의 dotenv
# 사용을 examples/run_local.py와 같은 자체 .env 파서로 바꿔서(외부 패키지 없이
# 직접 파싱 - k8s는 어차피 secret이 환경변수를 주입하니 .env 파일 자체가 없다)
# 이 설치 자체를 없앴다.
apiVersion: batch/v1
kind: Job
metadata:
  name: column-poc-batch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: sh-ard-asset-agent
        role: column-poc-batch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: column-poc-batch
          image: ghcr.io/seongwonm/sh-ard-asset-agent:0d293cd8a58bb27434f4a9d920e706c66b064647
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail
              SRC_DIR=/data/column_semantic_poc
              DATA_DIR=/data/robustness_test
              OUT_DIR=/data/robustness_test_results
              mkdir -p "$OUT_DIR"

              if [ ! -f "$SRC_DIR/run.py" ]; then
                echo "[ERROR] $SRC_DIR/run.py 가 없습니다. 먼저 PVC에 column_semantic_poc를 kubectl cp 하세요." >&2
                exit 1
              fi

              total=0
              ok=0
              skipped=0
              failed=""
              for csv in "$DATA_DIR"/*.csv; do
                total=$((total + 1))
                name=$(basename "${csv%.csv}")
                out="$OUT_DIR/${name}.semantic.json"

                if [ -f "$out" ]; then
                  echo "[SKIP] $name (이미 결과 있음)"
                  skipped=$((skipped + 1))
                  ok=$((ok + 1))
                  continue
                fi

                echo "[RUN] $name"
                err_log="$OUT_DIR/${name}.error.log"
                rm -f "$err_log"
                if python "$SRC_DIR/run.py" "$csv" \
                    --skills "$SRC_DIR/skills" \
                    --output "$out" 2>&1 | tee "$err_log"; then
                  ok=$((ok + 1))
                  rm -f "$err_log"
                else
                  echo "[FAIL] $name - 원인: $err_log 마지막 20줄 ↓"
                  tail -n 20 "$err_log"
                  failed="$failed $name"
                fi
              done

              echo "==== 완료: ${total}개 중 ${ok}개 성공 (스킵 ${skipped}개 포함) ===="
              if [ -n "$failed" ]; then
                echo "[FAILED LIST]$failed"
                echo "[FAILED LOGS] 각 파일의 전체 원인은 /data/robustness_test_results/<name>.error.log 에 남아있다."
                exit 1
              fi
          envFrom:
            - secretRef:
                name: sh-ard-asset-agent-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sh-ard-asset-agent-data
