# 강건성 테스트 전용 Job.
#
# 왜 Pod exec가 아니라 Job인가
#   기존 run-robustness-test.ps1은 `kubectl exec`로 배치를 돌린다.
#   1440회 실행은 몇 시간이 걸리는데, exec는 로컬 kubectl 세션에 묶여 있어
#   노트북을 닫거나 VPN이 끊기면 프로세스가 같이 죽는다.
#   Job은 클러스터가 소유하므로 세션과 무관하게 끝까지 돈다.
#
#   기존 스크립트도 계속 쓸 수 있다(-FetchOnly로 중간 결과만 받는 용도).
#   이 Job은 그 대안이지 대체가 아니다.
#
# exp 폴더
#   실행마다 PVC의 /data/results/exp{N}_{KST 타임스탬프}/ 가 새로 생기고,
#   그 안에 run.log(시작 메타데이터 + 호출/에이전트 흐름별 로그 + 종료 요약)와
#   robustness_results.jsonl이 같이 들어간다. 재시도도 이어달리기가 아니라
#   새 exp 폴더로 처음부터 다시 돈다 (backoffLimit을 0으로 둔 이유).
#
#   실행:  kubectl apply -f k8s/robustness-job.yaml
#   로그:  kubectl logs -f job/sh-ard-robustness
#   결과:  kubectl cp <pod>:/data/results/exp{N}_.../ ./results/exp{N}_.../
#   재실행: kubectl delete job sh-ard-robustness && kubectl apply -f k8s/robustness-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: sh-ard-robustness
spec:
  backoffLimit: 0
  # 완료 후에도 로그와 상태를 볼 수 있게 하루 유지
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: sh-ard-asset-agent
        role: robustness
    spec:
      restartPolicy: OnFailure
      containers:
        - name: robustness
          image: ghcr.io/seongwonm/sh-ard-asset-agent:c4e98389d5c574d0bfea64c7e4dc3568a0543d50
          imagePullPolicy: Always
          command:
            - python
            - examples/run_robustness_test.py
            - --data-dir=/data/robustness_test
            - --results-dir=/data/results
          envFrom:
            - secretRef:
                name: sh-ard-asset-agent-secret
          env:
            - name: LLM_STRUCTURED_MODE
              value: "guided_json"
            - name: AGENT_MAX_BATCH
              value: "8"
            - name: ROBUSTNESS_REPS
              value: "20"
            - name: PYTHONPATH
              value: "/app:/app/src"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sh-ard-asset-agent-data
