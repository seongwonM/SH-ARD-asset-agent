# 수동 디버그/실행용 Pod — sleep infinity로 띄운 뒤 exec로 들어가 사용한다.
# PVC에 코드를 올리고(upload-column-poc.ps1) 결과를 받아오는(download-...) 경유
# 지점이기도 하다.
#
#   kubectl apply -f k8s/data-pvc.yaml && kubectl apply -f k8s/pod.yaml
#   kubectl exec -it sh-ard-asset-agent -- /bin/bash
#     $ python -m column_semantics /data/robustness_test/x.csv --output /data/out.json
#     $ python experiments/check_endpoint.py    # LLM 연결/JSON 응답 점검
#
# 이미지 태그는 .github/workflows/build-push.yml이 커밋 SHA로 자동 갱신한다.
# 수동으로 건드리지 말 것.
#
# 메모리 상한이 넉넉한 이유: probe와 프로파일링이 DataFrame을 반복 조회한다
# (uniqueness는 표본이 아니라 전수 검사라 줄일 수 없다). 넓은 테이블에서
# 1Gi로는 부족했다.
apiVersion: v1
kind: Pod
metadata:
  name: sh-ard-asset-agent
  labels:
    app: sh-ard-asset-agent
spec:
  restartPolicy: Never
  containers:
    - name: sh-ard-asset-agent
      image: ghcr.io/seongwonm/sh-ard-asset-agent:92006f5bc6e049969c935701198dd90c4d112ea7
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      envFrom:
        - secretRef:
            name: sh-ard-asset-agent-secret
      env:
        - name: LLM_REQUESTS_PER_MINUTE
          value: "360"
        - name: LLM_MAX_CONCURRENCY
          value: "12"
        - name: PYTHONPATH
          value: "/app:/app/src"
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "3Gi"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sh-ard-asset-agent-data
